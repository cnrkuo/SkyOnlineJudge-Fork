# Development database. `docker compose up -d postgres`
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: skyoj
      POSTGRES_PASSWORD: skyoj
      POSTGRES_DB: skyoj
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - skyoj-postgres:/var/lib/postgresql/data

volumes:
  skyoj-postgres:
