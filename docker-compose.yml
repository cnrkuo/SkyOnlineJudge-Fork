# Development database and message queue. `docker compose up -d`
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: skyoj
      POSTGRES_PASSWORD: skyoj
      POSTGRES_DB: skyoj
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - skyoj-postgres:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - '127.0.0.1:5672:5672'
      # Management UI: http://localhost:15672 (guest / guest)
      - '127.0.0.1:15672:15672'
    volumes:
      - skyoj-rabbitmq:/var/lib/rabbitmq

volumes:
  skyoj-postgres:
  skyoj-rabbitmq:
